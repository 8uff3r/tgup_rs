[package]
name = "tgup_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.33"
pretty_env_logger = "0.5.0"
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls",
  "json",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
teloxide = { version = "0.17.0", default-features = false, features = [
  "macros",
  "rustls",
  "ctrlc_handler",
] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs"] }
url = "2.5.8"
urlencoding = "2.1.3"
